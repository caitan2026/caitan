<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>caitan2026</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #f8faf9; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      color: #222b29;
      font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    main {
      width: 100%;
      max-width: 536px;
      margin: auto;
      padding: 28px;
      text-align: center;
    }
    #status { margin: 0; color: #53635b; font-size: 15px; line-height: 1.8; }
    button {
      display: block;
      width: 100%;
      min-height: 56px;
      margin-top: 24px;
      padding: 15px 20px;
      border: 1px solid #078039;
      border-radius: 8px;
      background: #07883e;
      box-shadow: inset 0 1px 0 #ffffff26, 0 3px 0 #056b3014;
      color: #fff;
      font: inherit;
      font-weight: 600;
      white-space: normal;
      overflow-wrap: anywhere;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    [hidden] { display: none !important; }
    @media (hover: hover) { button:hover:not(:disabled) { background: #067735; } }
    button:active:not(:disabled) { background: #05682f; box-shadow: inset 0 2px 3px #003b2426; }
    button:focus-visible { outline: 3px solid #252a27; outline-offset: 4px; }
    button:disabled { background: #e1e7e3; border-color: #d3ddd6; color: #59665e; box-shadow: none; cursor: default; }
    noscript { display: block; margin-top: 20px; color: #626b65; font-size: 14px; }
  </style>
  <script src="entry.js" defer></script>
</head>
<body>
  <main>
    <div class="authorization">
      <p id="status" role="status">正在检查入口</p>
      <button id="continue" type="button" hidden>继续微信授权</button>
      <noscript>请启用 JavaScript 后重新打开。</noscript>
    </div>
  </main>
</body>
</html>
