<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>打开应用</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, sans-serif; color: #263640; background: #f4f7f6; }
    button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 10px; font: inherit; cursor: pointer; background: #16735b; color: white; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 3px solid #e6ad39; outline-offset: 3px; }
    #landing { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .card { width: 100%; max-width: 380px; padding: 32px 24px; background: white; border-radius: 20px; text-align: center; box-shadow: 0 12px 40px #14372a0a; }
    h1 { font-size: 24px; margin: 0 0 20px; }
    p { line-height: 1.65; overflow-wrap: anywhere; }
    .note { color: #65716c; font-size: 13px; }
    progress { width: 100%; height: 8px; accent-color: #16735b; margin: 12px 0 24px; }
    #viewer { position: fixed; inset: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: white; }
    .toolbar { flex: none; padding: 6px 10px; border-bottom: 1px solid #e4e9e6; }
    .actions { display: flex; gap: 8px; }
    .actions button { padding: 8px 12px; font-size: 14px; }
    #frame-status { margin: 5px 0 0; font-size: 12px; line-height: 1.5; }
    #frame-host { flex: 1; min-height: 0; }
    iframe { display: block; border: 0; width: 100%; height: 100%; background: white; }
  </style>
  <script src="./container.js" defer></script>
</head>
<body>
  <main id="landing">
    <section class="card">
      <h1>打开应用</h1>
      <p id="status" role="status" aria-live="polite">正在准备容器…</p>
      <progress id="countdown" max="3000" value="0" aria-label="等待三秒" hidden></progress>
      <button id="open" type="button" hidden disabled>打开应用</button>
      <p class="note">应用在内嵌页面中打开。微信授权或浏览器限制可能导致无法显示，本页不会自动跳转。</p>
      <noscript>请启用 JavaScript 后重新打开此页面。</noscript>
    </section>
  </main>
  <section id="viewer" aria-label="应用容器" hidden>
    <header class="toolbar">
      <div class="actions">
        <button id="reload" type="button">重新加载</button>
        <button id="back" type="button">返回容器</button>
      </div>
      <p id="frame-status" role="status" aria-live="polite"></p>
    </header>
    <div id="frame-host"></div>
  </section>
</body>
</html>
